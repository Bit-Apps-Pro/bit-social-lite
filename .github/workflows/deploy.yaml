name: Deploy to WordPress.org Repository

on:
  push:
    branches:
      - release
  release:
    types: [released]

jobs:
  deploy_to_wp_repository:
    name: Deploy to WP.org
    runs-on: ubuntu-latest
    env:
      PLUGIN_SLUG: bit-social
      PLUGIN_SLUG_PRO: bit-social-pro
      SERVER_VARIABLES: bit_social_
      SSH_AUTH_SOCK: /tmp/ssh_agent.sock
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: pnpm install

      - name: Check for SVN
        id: check_svn
        run: |
          if ! command -v svn &> /dev/null; then
            echo "SVN not found, installing..."
            sudo apt-get update
            sudo apt-get install -y subversion
          else
            echo "SVN is already installed."
          fi

      - name: Setup PHP
        id: setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.x'
          tools: composer:v2, wp-cli

      - name: Determine if this is a release or push
        id: set-test-action
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "TEST_ACTION=false" >> $GITHUB_ENV
          else
            echo "TEST_ACTION=true" >> $GITHUB_ENV
          fi

      - name: Build
        id: build-plugin
        run: |
          pnpm prod:free
          pnpm prod:pro
          if [ -d "${{ github.workspace }}/build/${{ env.PLUGIN_SLUG }}" ]; then
            echo "free_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "free_exists=false" >> "${GITHUB_OUTPUT}"
          fi
          if [ -d "${{ github.workspace }}/build/${{ env.PLUGIN_SLUG_PRO }}" ]; then
            echo "pro_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "pro_exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: WordPress Plugin Deploy
        if: steps.build-plugin.outputs.free_exists == 'true'
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
          dry-run: ${{ env.TEST_ACTION }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          BUILD_DIR: '${{ github.workspace }}/build/${{ env.PLUGIN_SLUG }}'
          SLUG: ${{ env.PLUGIN_SLUG }}

      - name: Create ssh config
        run: |
          if [[ ! -d ~/.ssh ]]; then
            mkdir ~/.ssh
          fi
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/access_key
          echo "Host git-server
            HostName ${{ secrets.SSH_HOST }}
            Port ${{ secrets.SSH_PORT }}
            IdentityFile ~/.ssh/access_key
            User git" > ~/.ssh/config
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/access_key
          chmod 600 ~/.ssh/config
          chmod 600 ~/.ssh/known_hosts

      - name: Setup SSH with a passphrase
        env:
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          echo "pass: $SSH_PASSPHRASE"
          echo "echo $SSH_PASSPHRASE" > ~/.ssh_askpass && chmod +x ~/.ssh_askpass
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' | DISPLAY=None SSH_ASKPASS=~/.ssh_askpass ssh-add - >/dev/null

      - name: Release Pro
        if: steps.build-plugin.outputs.pro_exists == 'true' && env.TEST_ACTION == 'false'
        run: |
          cd ${{ github.workspace }}/build/${{ env.PLUGIN_SLUG_PRO }}
          git config --global user.email "developer+bot@bitcode.pro"
          git config --global user.name "Deploy Bot"
          git init
          git remote add prod ssh://git-server:/home/git/products/${{ env.PLUGIN_SLUG_PRO }}.git
          git add .
          git commit -m "releasing ${{ env.PLUGIN_SLUG_PRO }}"
          git push -f prod HEAD:main

      - name: Upload release asset
        if: steps.build-plugin.outputs.free_exists == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ steps.deploy.outputs['zip-path'] }}
