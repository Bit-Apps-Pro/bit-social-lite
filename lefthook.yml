pre-commit:
  # piped: true
  parallel: true
  commands:
    style-lint:
      glob: '*.{css,scss}'
      run: pnpm lint:css {staged_files}
    php-lint:
      glob: '*.{php}'
      run: pnpm lint:php {staged_files}
    php-test:
      glob: '*{php}'
      run: pnpm test:php {staged_files}
    php-compatibility-pro-version:
      glob: 'pro/backend/**/*.php'
      run: pnpm pro-compat {staged_files}
    php-compatibility-free-version:
      glob: 'backend/**/*.php'
      run: pnpm free-compat {staged_files}
    ts-lint:
      glob: '*.{js,ts,jsx,tsx}'
      run: pnpm lint
    pretty:
      run: pnpm pretty:fix
    ts-check:
      glob: '*.{ts,tsx}'
      run: pnpm ts
    # test:
    #   glob: '*.test.{js,ts,jsx,tsx}'
    #   run: pnpm test

commit-msg:
  commands:
    commit-lint:
      run: pnpm commitlint --edit {1}

post-merge:
  commands:
    install:
      run: pnpm sync-plugin-commons
